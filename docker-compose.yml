version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhook_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webhook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: webhook_api
    restart: unless-stopped
    command: >
      sh -c "python -m app.database.migrations &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/webhook_engine
      REDIS_URL: redis://redis:6379/0
      WEBHOOK_SECRET: compose_super_secret_webhook_signing_key_32bytes
      MAX_RETRIES: 3
      RETRY_BASE_DELAY: 2
      REQUEST_TIMEOUT: 5
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: webhook_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -l info
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/webhook_engine
      REDIS_URL: redis://redis:6379/0
      WEBHOOK_SECRET: compose_super_secret_webhook_signing_key_32bytes
      MAX_RETRIES: 3
      RETRY_BASE_DELAY: 2
      REQUEST_TIMEOUT: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  receiver:
    build: .
    container_name: webhook_receiver
    restart: unless-stopped
    command: uvicorn receiver.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

volumes:
  postgres_data:
